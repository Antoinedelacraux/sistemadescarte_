<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0f2b1f"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <!-- Fondo redondeado estilo app icono -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="rgba(255,255,255,0.04)"/>
  <!-- Emblema agrícola: Espiga / Hoja -->
  <g transform="translate(106, 86) scale(0.6)">
    <!-- Tallo central -->
    <path d="M 250 480 Q 250 200 250 40" stroke="#f0fdf4" stroke-width="22" stroke-linecap="round" fill="none"/>
    <!-- Granos y espigas -->
    <ellipse cx="250" cy="50" rx="36" ry="60" fill="url(#leaf)"/>
    <ellipse cx="190" cy="130" rx="34" ry="55" transform="rotate(-35 190 130)" fill="url(#leaf)"/>
    <ellipse cx="310" cy="130" rx="34" ry="55" transform="rotate(35 310 130)" fill="url(#leaf)"/>
    <ellipse cx="180" cy="220" rx="34" ry="55" transform="rotate(-40 180 220)" fill="url(#leaf)"/>
    <ellipse cx="320" cy="220" rx="34" ry="55" transform="rotate(40 320 220)" fill="url(#leaf)"/>
    <ellipse cx="190" cy="310" rx="34" ry="55" transform="rotate(-35 190 310)" fill="url(#leaf)"/>
    <ellipse cx="310" cy="310" rx="34" ry="55" transform="rotate(35 310 310)" fill="url(#leaf)"/>
  </g>
</svg>
